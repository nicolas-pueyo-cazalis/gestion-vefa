name: CI

# Vérifications minimales à chaque push/pull request (21/07/2026, audit
# CI/CD) — avant, tout dépendait de la vigilance manuelle (lancer le lint
# soi-même avant de commiter, ou pas).
# Étapes "tests" ajoutées le 01/09/2026 (docs/specs/tests-automatises-serveur.md,
# docs/specs/tests-automatises-client.md) : suite de tests automatisés
# (Vitest) sur les fonctions de calcul pur, serveur puis client.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-front:
    name: Lint front-end (oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client

  verifie-back:
    name: Vérification de syntaxe back-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: node --check sur chaque fichier .js
        working-directory: server
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

  test-back:
    name: Tests automatisés back-end (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  test-front:
    name: Tests automatisés front-end (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
